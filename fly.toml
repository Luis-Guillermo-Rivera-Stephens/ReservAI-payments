app = "passmanager-stripe-service"
primary_region = "gdl"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = false
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  PORT = "3001"